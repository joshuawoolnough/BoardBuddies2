<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hint">Click the game once so your browser allows sound. ARROWS/WASD move &middot; Z/ENTER confirm &middot; X cancel &middot; ESC menu &middot; SHIFT run &middot; M mute</div>
<script>

// ---- p1_core.js ----
'use strict';
// ===================== CORE: canvas, input, font, drawing, audio, save =====================
const W=400,H=240;
const cv=document.getElementById('c'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;

// ---------- INPUT ----------
const keys={},pressed={};
function codeOf(e){
  if(e.code)return e.code;const k=e.key||'';
  if(k===' ')return 'Space';if(k==='Shift')return 'ShiftLeft';if(k.length===1&&/[a-z]/i.test(k))return 'Key'+k.toUpperCase();return k;
}
addEventListener('keydown',e=>{
  const c=codeOf(e);if(!keys[c])pressed[c]=true;keys[c]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace','Tab'].includes(c))e.preventDefault();
  AudioSys.resume();
});
addEventListener('keyup',e=>{keys[codeOf(e)]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const Input={
  rep:{},
  up:()=>!!(keys.ArrowUp||keys.KeyW),down:()=>!!(keys.ArrowDown||keys.KeyS),
  left:()=>!!(keys.ArrowLeft||keys.KeyA),right:()=>!!(keys.ArrowRight||keys.KeyD),
  run:()=>!!(keys.ShiftLeft||keys.ShiftRight),
  confirmP:()=>!!(pressed.KeyZ||pressed.Enter||pressed.Space||pressed.KeyJ),
  cancelP:()=>!!(pressed.KeyX||pressed.Backspace||pressed.KeyK),
  escP:()=>!!pressed.Escape,
  menuP:()=>!!(pressed.Escape||pressed.KeyI),
  muteP:()=>!!pressed.KeyM,
  anyP:()=>Object.keys(pressed).some(k=>pressed[k]),
  // directional press with hold-repeat for menus
  nav(dir){
    const held=this[dir]();
    if(!held){this.rep[dir]=0;return false;}
    this.rep[dir]=(this.rep[dir]||0)+1;
    const r=this.rep[dir];
    return r===1||(r>14&&(r-14)%5===0);
  },
  flush(){for(const k in pressed)pressed[k]=false;}
};

// ---------- FONT (3x5 bitmap) ----------
const FONT_DATA={
A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",
G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",
S:"011100010001110",T:"111010010010010",U:"101101101101011",V:"101101101101010",W:"101101111111101",X:"101101010101101",
Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"111001011001111","4":"101101111001001","5":"111100110001110",
"6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
" ":"000000000000000","!":"010010010000010","?":"110001010000010",".":"000000000000010",",":"000000000010100","'":"010010000000000",
'"':"101101000000000","-":"000000111000000","+":"000010111010000",":":"000010000010000",";":"000010000010100","/":"001001010100100",
"(":"010100100100010",")":"010001001001010","=":"000111000111000","%":"101001010100101","*":"101010111010101","<":"001010100010001",
">":"100010001010100","[":"110100100100110","]":"011001001001011","_":"000000000000111","~":"000011110000000","&":"010101010101011",
"#":"101111101111101","@":"101111111010000","}":"100110111110100","{":"010111111111010","^":"010111010010010","|":"010010010010010",
"$":"010111100111010"
};
const fontCache={};
function glyphCanvas(ch,color,scale){
  const key=ch+color+scale;if(fontCache[key])return fontCache[key];
  const d=FONT_DATA[ch]||FONT_DATA['?'];
  const c=document.createElement('canvas');c.width=3*scale;c.height=5*scale;const g=c.getContext('2d');g.fillStyle=color;
  for(let i=0;i<15;i++)if(d[i]==='1')g.fillRect((i%3)*scale,Math.floor(i/3)*scale,scale,scale);
  fontCache[key]=c;return c;
}
function text(str,x,y,color='#fff',scale=2,shadow=null){
  str=String(str).toUpperCase();let cx=x;
  for(const ch of str){
    if(ch==='\n'){cx=x;y+=7*scale;continue;}
    if(ch!==' '){
      if(shadow)ctx.drawImage(glyphCanvas(ch,shadow,scale),cx+scale,y+scale);
      ctx.drawImage(glyphCanvas(ch,color,scale),cx,y);
    }
    cx+=4*scale;
  }
  return cx;
}
const textW=(s,scale=2)=>String(s).length*4*scale-scale;
function textC(str,cx,y,color,scale=2,shadow){text(str,Math.round(cx-textW(str,scale)/2),y,color,scale,shadow);}
function textR(str,rx,y,color,scale=2,shadow){text(str,Math.round(rx-textW(str,scale)),y,color,scale,shadow);}
function wrap(str,maxChars){
  const out=[];for(const para of String(str).split('\n')){let line='';for(const w of para.split(' ')){
    if((line+' '+w).trim().length>maxChars){out.push(line.trim());line=w;}else line=(line+' '+w);}
    out.push(line.trim());}
  return out;
}

// ---------- DRAWING ----------
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function frame(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);}
function box(x,y,w,h,opts={}){
  const fill=opts.fill||'#1c2a6c',fill2=opts.fill2||'#12184a';
  rect(x,y,w,h,'#000');
  rect(x+1,y+1,w-2,h-2,fill);
  rect(x+2,y+2,w-4,h-4,fill2);
  // gradient-ish stripes
  ctx.fillStyle=fill;for(let i=0;i<h-4;i+=4)ctx.fillRect(x+2,y+2+i,w-4,1);
  frame(x+2,y+2,w-4,h-4,'#ffffff');
  frame(x+3,y+3,w-6,h-6,'#8090c0');
}
function bar(x,y,w,h,ratio,c1,c2='#202020'){rect(x,y,w,h,c2);const f=Math.round((w-2)*clamp(ratio,0,1));rect(x+1,y+1,f,h-2,c1);frame(x,y,w,h,'#000');}

// palette
const PAL={K:'#101018',W:'#ffffff',R:'#d12a2a',r:'#ff7b6b',O:'#f28c28',Y:'#f9d83a',G:'#2f9e44',g:'#8be36a',B:'#2f56c9',b:'#7fb0f5',
P:'#8a3bc4',p:'#f4a7d9',N:'#8b5a2b',n:'#d4a06a',S:'#f6cfa8',D:'#3d3d48',d:'#7c7c8a',l:'#c8c8d2',T:'#25a5a5',w:'#f8f0dc',M:'#e0489c',
k:'#202030',E:'#5c4b3a',e:'#a58a63',V:'#6b8f3a',v:'#b4d75a',C:'#c0c8f0',c:'#e4e8ff',i:'#3b6bd6',Q:'#ffe8a0',q:'#c9a04a',u:'#4b2c6b',x:'#c9d6e0'};
const spriteCache={};
function drawSprite(rows,x,y,scale=1,flip=false,tint=null){
  const key=rows.join('|')+'#'+scale+'#'+(flip?1:0)+'#'+(tint||'');
  let c=spriteCache[key];
  if(!c){
    const h=rows.length,w=rows[0].length;
    c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const g=c.getContext('2d');
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;
      g.fillStyle=tint||PAL[ch]||'#f0f';const px=flip?(w-1-i):i;g.fillRect(px*scale,j*scale,scale,scale);}
    spriteCache[key]=c;
  }
  ctx.drawImage(c,Math.round(x),Math.round(y));
}

// ---------- AUDIO ----------
const NOTE_FREQ={};(()=>{const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];for(let o=0;o<9;o++)for(let i=0;i<12;i++){NOTE_FREQ[names[i]+o]=440*Math.pow(2,(o*12+i-57)/12);}})();
const AudioSys={
  ctx:null,master:null,on:true,song:null,songName:null,timer:null,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.5;this.master.connect(this.ctx.destination);}catch(e){}},
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  toggle(){this.on=!this.on;if(this.master)this.master.gain.value=this.on?0.5:0;},
  tone(freq,dur,type='square',vol=0.2,slide=0,t0=null){
    if(!this.ctx)return;const t=t0??this.ctx.currentTime;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02);
  },
  noise(dur,vol=0.2,t0=null){
    if(!this.ctx)return;const t=t0??this.ctx.currentTime;const n=Math.floor(this.ctx.sampleRate*dur);const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=this.ctx.createBufferSource();s.buffer=buf;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(g);g.connect(this.master);s.start(t);
  },
  sfx(name){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    switch(name){
      case 'cursor':this.tone(880,0.05,'square',0.12);break;
      case 'confirm':this.tone(660,0.06,'square',0.15);this.tone(990,0.1,'square',0.15,0,t+0.06);break;
      case 'cancel':this.tone(440,0.08,'square',0.12,-200);break;
      case 'error':this.tone(200,0.15,'sawtooth',0.15,-100);break;
      case 'hit':this.noise(0.12,0.3);this.tone(150,0.12,'square',0.2,-100);break;
      case 'crit':this.noise(0.2,0.4);this.tone(300,0.2,'sawtooth',0.25,-250);break;
      case 'magic':for(let i=0;i<6;i++)this.tone(400+i*120,0.1,'triangle',0.15,0,t+i*0.04);break;
      case 'heal':for(let i=0;i<4;i++)this.tone(523*Math.pow(2,i/12*4),0.18,'sine',0.18,0,t+i*0.08);break;
      case 'shield':this.tone(300,0.25,'triangle',0.2,300);break;
      case 'marker':this.tone(1400+Math.random()*800,0.08,'sawtooth',0.05,-400);break;
      case 'pop':this.tone(600,0.08,'square',0.2,600);break;
      case 'dp':this.tone(700,0.05,'triangle',0.12,300);break;
      case 'levelup':[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.25,'square',0.15,0,t+i*0.09));break;
      case 'item':this.tone(700,0.08,'triangle',0.15);this.tone(1050,0.12,'triangle',0.15,0,t+0.08);break;
      case 'chest':[600,800,1000,1400].forEach((f,i)=>this.tone(f,0.12,'square',0.15,0,t+i*0.06));break;
      case 'step':this.noise(0.03,0.04);break;
      case 'encounter':for(let i=0;i<8;i++)this.tone(200+i*90,0.06,'square',0.15,0,t+i*0.03);break;
      case 'die':this.tone(220,0.5,'sawtooth',0.2,-180);this.noise(0.4,0.15);break;
      case 'text':this.tone(1200,0.02,'square',0.04);break;
      case 'poison':this.tone(180,0.2,'sawtooth',0.12,60);break;
      case 'flee':for(let i=0;i<5;i++)this.noise(0.05,0.1,t+i*0.08);break;
      case 'buff':this.tone(500,0.1,'square',0.15,200);this.tone(700,0.15,'square',0.15,300,t+0.1);break;
      case 'debuff':this.tone(500,0.15,'square',0.15,-200);this.tone(400,0.2,'square',0.15,-200,t+0.12);break;
    }
  },
  // ---- sequencer ----
  parseTrack(str){ // tokens like "C4/2" (note, steps) or "./4" rest
    const out=[];for(const tok of str.trim().split(/\s+/)){if(!tok)continue;const [n,l]=tok.split('/');out.push({n:n==='.'?null:n,l:parseFloat(l||'1')});}return out;
  },
  playSong(name){
    if(this.songName===name)return;this.stopSong();this.songName=name;const s=SONGS[name];if(!s)return;
    this.init();if(!this.ctx)return;
    const tracks=s.tracks.map(tr=>({...tr,notes:this.parseTrack(tr.notes),i:0,t:0}));
    const stepDur=60/s.bpm/4;
    const song={tracks,stepDur,start:this.ctx.currentTime+0.1,loop:s.loop!==false};
    tracks.forEach(tr=>{tr.len=tr.notes.reduce((a,n)=>a+n.l,0);});
    this.song=song;
    const schedule=()=>{
      if(this.song!==song)return;const now=this.ctx.currentTime;
      for(const tr of tracks){
        while(song.start+tr.t*stepDur<now+0.35){
          const nt=tr.notes[tr.i];
          if(nt.n){const f=NOTE_FREQ[nt.n];const when=song.start+tr.t*stepDur;const dur=nt.l*stepDur*(tr.gate||0.85);
            if(tr.wave==='noise')this.noise(Math.min(dur,0.12),(tr.vol||0.1),when);
            else this.tone(f,dur,tr.wave||'square',(tr.vol||0.1)*(this.on?1:1),0,when);}
          tr.t+=nt.l;tr.i++;
          if(tr.i>=tr.notes.length){if(!song.loop){tr.i=tr.notes.length-1;tr.t+=1e9;}else tr.i=0;}
        }
      }
    };
    schedule();this.timer=setInterval(schedule,120);
  },
  stopSong(){if(this.timer)clearInterval(this.timer);this.timer=null;this.song=null;this.songName=null;}
};

// ---------- SAVE ----------
const SAVE_KEY='boardbuddies_save_v1';
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));return true;}catch(e){return false;}}
function loadGame(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}

// ---------- screen effects ----------
const FX={shake:0,flash:0,flashC:'#fff',fade:0,fadeDir:0,fadeCb:null};
function fadeOut(cb){FX.fadeDir=1;FX.fadeCb=cb;}
function fadeIn(){FX.fadeDir=-1;}
function updateFX(){
  if(FX.shake>0)FX.shake--;
  if(FX.flash>0)FX.flash--;
  if(FX.fadeDir===1){FX.fade=Math.min(1,FX.fade+0.08);if(FX.fade>=1){FX.fadeDir=0;const cb=FX.fadeCb;FX.fadeCb=null;if(cb)cb();fadeIn();}}
  else if(FX.fadeDir===-1){FX.fade=Math.max(0,FX.fade-0.06);if(FX.fade<=0)FX.fadeDir=0;}
}
function drawFX(){
  if(FX.flash>0){ctx.globalAlpha=Math.min(1,FX.flash/6);rect(0,0,W,H,FX.flashC);ctx.globalAlpha=1;}
  if(FX.fade>0){ctx.globalAlpha=FX.fade;rect(0,0,W,H,'#000');ctx.globalAlpha=1;}
}

function tier(l,m={}){return {lvl:l,hp:Math.round((26+l*l*0.45+l*8)*(m.hp||1)),atk:Math.round((7+l*1.9)*(m.atk||1)),def:Math.round((2+l*1.25)*(m.def||1)),mag:Math.round((3+l*1.6)*(m.mag||1)),
  spd:Math.round((5+l*0.3)*(m.spd||1)),xp:Math.round((8+l*l*0.95)*(m.xp||1)),merit:Math.round((4+l*0.6)*(m.merit||1))};}
function E(name,spr,l,m,extra){return Object.assign({name,spr},tier(l,m),extra);}

function buildOverworld(){
  const W=60,H=36;const g=[];for(let y=0;y<H;y++){g.push(Array(W).fill('g'));}
  for(let x=0;x<W;x++){g[0][x]='f';g[H-1][x]='f';}for(let y=0;y<H;y++){g[y][0]='f';g[y][W-1]='f';}
  const bld=(x,y,door)=>{for(let j=0;j<2;j++)for(let i=0;i<8;i++)g[y+j][x+i]='R';for(let i=0;i<8;i++)g[y+2][x+i]=(i===3)?door:'W';};
  const hpath=(y,x1,x2)=>{for(let x=x1;x<=x2;x++)g[y][x]='.';};const vpath=(x,y1,y2)=>{for(let y=y1;y<=y2;y++)g[y][x]='.';};
  // paths first, buildings on top (so doors stay intact)
  hpath(5,2,52);hpath(14,2,57);hpath(23,2,57);
  vpath(6,5,23);vpath(30,5,23);vpath(54,5,23);vpath(18,14,23);vpath(42,14,23);
  // band 1: towns
  bld(3,2,'A');bld(16,2,'B');bld(29,2,'C');bld(42,2,'D');
  // band 2: dungeons 1-5
  [3,15,27,39,51].forEach((x,i)=>bld(x,11,String(i+1)));
  // band 3: dungeons 6-0
  ['6','7','8','9','0'].forEach((d,i)=>bld(3+i*12,20,d));
  // playground south
  for(let y=26;y<=30;y++)for(let x=8;x<=18;x++)g[y][x]='s';
  for(let x=24;x<=34;x++){g[26][x]='h';g[31][x]='h';}for(let y=26;y<=31;y++){g[y][24]='h';g[y][34]='h';}g[26][29]='g';
  for(let y=27;y<=30;y++)for(let x=40;x<=50;x++)g[y][x]='w';g[27][40]='g';g[30][50]='g';
  hpath(25,2,57);vpath(6,23,33);vpath(54,23,33);hpath(33,6,54);
  // trees & benches (deterministic)
  const spots=[[2,8],[10,8],[24,8],[36,8],[48,8],[57,8],[2,17],[10,17],[22,17],[34,17],[46,17],[57,17],[2,30],[21,28],[36,28],[38,32],[52,29],[57,31],[13,33],[27,33],[44,33]];
  for(const [x,y] of spots)if(g[y][x]==='g')g[y][x]='t';
  for(const [x,y] of [[13,7],[45,7],[25,16],[49,16],[20,31],[36,30]])if(g[y][x]==='g')g[y][x]='e';
  for(const [x,y] of [[8,9],[33,9],[57,12],[2,22],[38,16],[57,26]])if(g[y][x]==='g')g[y][x]='h';
  g[6][6]='P';
  return g.map(r=>r.join(''));
}

// chapter-based overworld encounters: region 0 north, 1 middle, 2 south
function overworldEnc(region){
  const ch=Math.min(10,Math.max(1,G.chapter));let cands;
  if(region===0)cands=[1,2,3];else if(region===1)cands=[Math.max(1,ch-2),Math.max(1,ch-1),ch];else cands=[ch,Math.min(10,ch+0)];
  cands=cands.filter(c=>c<=ch&&c<=10);const d=DUNGEONS[pick(cands)];return pick(d.enc);
}

// ---- p6_engine.js ----
// ===================== BB2 ENGINE: state, scenes, dialogue, maps (overworld / rooms / dungeons) =====================
let G=null;
function heroStat(h,k){const d=HEROES[h.id];return Math.floor(d.base[k]+d.grow[k]*(h.lvl-1));}
function mkHero(id){const h={id,lvl:1,xp:0};h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');return h;}
function heroSkills(h){return HEROES[h.id].skills.filter(s=>SKILLS[s].lvl<=h.lvl);}
function heroDraws(h){return HEROES[h.id].draws;}
function addXP(h,xp){const gained=[];h.xp+=xp;while(h.lvl<60&&h.xp>=XP_FOR(h.lvl)){h.lvl++;gained.push(h.lvl);h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');}return gained;}
function levelUpHero(h){h.xp=Math.max(h.xp,XP_FOR(h.lvl));return addXP(h,0);}
function newGame(){
  G={heroes:{},party:['fred','donny'],inv:{glue:4,rubber:2,sharp:1},merit:60,chapter:1,cleared:[false,false,false,false,false,false,false,false,false,false,false],flags:{},steps:0,battles:0,ending:false,
    savePos:{where:'room',id:'classroom'},overMusic:'over'};
  for(const id in HEROES)G.heroes[id]=mkHero(id);
}
function partyHeroes(){return G.party.map(id=>G.heroes[id]);}
function addItem(id,n=1){G.inv[id]=(G.inv[id]||0)+n;if(G.inv[id]<=0)delete G.inv[id];}
function fullHeal(){for(const h of partyHeroes()){h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');}}
function avgLevel(){const p=partyHeroes();return Math.floor(p.reduce((a,h)=>a+h.lvl,0)/Math.max(1,p.length));}
function joinParty(id){if(G.party.includes(id))return false;const h=G.heroes[id];const target=avgLevel();if(h.lvl<target){h.lvl=target;h.xp=XP_FOR(target-1);}h.hp=heroStat(h,'hp');h.mp=heroStat(h,'mp');if(G.party.length>=4)G.party.pop();G.party.push(id);return true;}
function leaveParty(id){const i=G.party.indexOf(id);if(i>=0)G.party.splice(i,1);return i>=0;}

// ---------- SCENE STACK ----------
const Scene={stack:[],
  push(s){this.stack.push(s);Input.flush();},pop(){this.stack.pop();Input.flush();},
  replace(s){this.stack=[s];Input.flush();},top(){return this.stack[this.stack.length-1];},
  update(){const t=this.top();if(t&&t.update)t.update();},
  draw(){let start=0;for(let i=this.stack.length-1;i>=0;i--){if(this.stack[i].opaque){start=i;break;}}for(let i=start;i<this.stack.length;i++)if(this.stack[i].draw)this.stack[i].draw();}
};

// ---------- DIALOGUE / CUTSCENES ----------
class Dialogue{
  constructor(steps,onDone){this.steps=steps.slice();this.i=-1;this.onDone=onDone;this.chars=0;this.t=0;this.pages=[];this.page=0;this.next();}
  next(){
    this.i++;
    if(this.i>=this.steps.length){Scene.pop();if(this.onDone)this.onDone();return;}
    const s=this.steps[this.i];
    if(typeof s==='string'){
      const k=s.indexOf('|');this.who=s.slice(0,k);const txt=s.slice(k+1);this.portrait=PORTRAITS[this.who]||null;
      const lines=wrap(txt,this.portrait?40:47);this.pages=[];for(let j=0;j<lines.length;j+=3)this.pages.push(lines.slice(j,j+3));
      this.page=0;this.chars=0;return;
    }
    if(s.music)AudioSys.playSong(s.music);
    if(s.join&&joinParty(s.join)){this.steps.splice(this.i+1,0,'*|'+HEROES[s.join].name+' joined the party! (Lv '+G.heroes[s.join].lvl+')');AudioSys.sfx('levelup');}
    if(s.leave&&leaveParty(s.leave)){this.steps.splice(this.i+1,0,'*|'+HEROES[s.leave].name+' left the party.');AudioSys.sfx('cancel');}
    if(s.item){addItem(s.item,s.n||1);this.steps.splice(this.i+1,0,'*|Got '+ITEMS[s.item].name+(s.n>1?' x'+s.n:'')+'!');AudioSys.sfx('chest');}
    if(s.shake)FX.shake=25;
    if(s.flash){FX.flash=10;FX.flashC='#fff';}
    if(s.heal)fullHeal();
    if(s.fn)s.fn();
    this.next();
  }
  update(){
    this.t++;const pg=this.pages[this.page]||[];const total=pg.reduce((a,l)=>a+l.length,0);
    if(this.chars<total){this.chars+=(keys.KeyZ||keys.Enter||keys.Space)?3:1;if(this.chars%3===0)AudioSys.sfx('text');}
    if(Input.confirmP()){
      if(this.chars<total)this.chars=total;
      else{AudioSys.sfx('cursor');if(this.page<this.pages.length-1){this.page++;this.chars=0;}else this.next();}
    }
  }
  draw(){
    const y=H-66;box(0,y,W,66);
    let tx=14;
    if(this.portrait){rect(8,y+8,52,52,'#0a0a1a');frame(8,y+8,52,52,'#8090c0');drawSprite(SPR[this.portrait],10,y+10,3);tx=68;}
    if(this.who!=='*')text(this.who,tx,y+6,'#f9d83a',1);
    const pg=this.pages[this.page]||[];let left=this.chars;
    for(let j=0;j<pg.length;j++){const l=pg[j];const n=Math.min(l.length,left);left-=n;text(l.slice(0,n),tx,y+15+j*14,this.who==='*'?'#c8d0f0':'#fff',2);if(left<=0)break;}

// ---------- MAP SCENE ----------
class MapScene{
  constructor(rows,theme,opts){
    this.opaque=true;this.opts=opts;this.kind=opts.kind;this.theme=THEMES[theme];const w=Math.max(...rows.map(r=>r.length));this.mw=w;this.mh=rows.length;
    this.grid=rows.map(r=>r.padEnd(w,'#').split(''));this.npcs=[];this.chests=[];this.boss=null;this.doors=[];let ni=0,ci=0;this.sx=null;
    for(let y=0;y<this.mh;y++)for(let x=0;x<w;x++){const ch=this.grid[y][x];
      if(ch==='P'){this.sx=x;this.sy=y;this.grid[y][x]=this.kind==='over'?'.':'.';}
      else if(ch==='N'){const d=opts.npcs[ni]||opts.npcs[0];if(d){this.npcs.push({x,y,spr:d.spr,name:d.name,data:d});}ni++;this.grid[y][x]='.';}
      else if(ch==='C'){this.chests.push({x,y,item:(opts.chests||[])[ci],idx:ci});ci++;}
      else if(ch==='X'){this.boss={x,y};this.grid[y][x]=opts.bossActive?'X':'.';}
      else if(this.kind==='over'&&DOOR_CHARS.has(ch)){this.doors.push({x,y,id:ch});}
    }
    // exit door: 'o' adjacent to start (dungeons) or in bottom interior row (rooms)
    this.exit=null;
    if(this.kind!=='over'){
      if(this.sx!==null){for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){const x=this.sx+dx,y=this.sy+dy;if(this.grid[y]&&this.grid[y][x]==='o'){this.exit={x,y};break;}}}
      if(!this.exit){const y=this.mh-2;const x=this.grid[y].indexOf('o');if(x>=0){this.exit={x,y};if(this.sx===null){this.sx=x;this.sy=y-1;}}}
    }
    const st=opts.startPos||[this.sx,this.sy];this.px=st[0];this.py=st[1];this.ox=0;this.oy=0;this.dir=opts.dir||'down';this.moving=false;this.anim=0;this.stepsSince=0;this.t=0;this.busy=false;
    this.layer=document.createElement('canvas');this.layer.width=w*16;this.layer.height=this.mh*16;const g=this.layer.getContext('2d');
    for(let y=0;y<this.mh;y++)for(let x=0;x<w;x++){let ch=this.grid[y][x];if(ch==='C'||ch==='X')ch=this.kind==='over'?'g':'.';drawTileTo(g,ch,x*16,y*16,this.theme);}
    this.camX=0;this.camY=0;this.updateCam(true);
  }
  chestOpened(c){return !!G.flags[this.opts.chestKey+c.idx];}
  solid(x,y){if(x<0||y<0||x>=this.mw||y>=this.mh)return true;const ch=this.grid[y][x];if(ch==='C'){const c=this.chests.find(c=>c.x===x&&c.y===y);if(c&&!this.chestOpened(c))return true;return false;}
    if(SOLID.has(ch))return true;if(this.npcs.some(n=>n.x===x&&n.y===y))return true;return false;}
  updateCam(snap){const tx=clamp(this.px*16+this.ox+8-W/2,0,Math.max(0,this.mw*16-W)),ty=clamp(this.py*16+this.oy+8-H/2,0,Math.max(0,this.mh*16-H));
    if(snap){this.camX=tx;this.camY=ty;}else{this.camX+=(tx-this.camX)*0.2;this.camY+=(ty-this.camY)*0.2;}}
  facing(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[this.dir];return [this.px+d[0],this.py+d[1]];}
  update(){
    this.t++;
    if(this.busy)return;
    if(Input.menuP()){AudioSys.sfx('confirm');Scene.push(new PauseMenu(this));return;}
    if(!this.moving){
      let dx=0,dy=0;
      if(Input.up()){dy=-1;this.dir='up';}else if(Input.down()){dy=1;this.dir='down';}else if(Input.left()){dx=-1;this.dir='left';}else if(Input.right()){dx=1;this.dir='right';}
      if(Input.confirmP()){this.interact();return;}
      if(dx||dy){if(!this.solid(this.px+dx,this.py+dy)){this.moving=true;this.mdx=dx;this.mdy=dy;this.ox=0;this.oy=0;}}
    }
    if(this.moving){
      const sp=Input.run()?4:2;this.ox+=this.mdx*sp;this.oy+=this.mdy*sp;this.anim+=sp;
      if(Math.abs(this.ox)>=16||Math.abs(this.oy)>=16){this.px+=this.mdx;this.py+=this.mdy;this.ox=0;this.oy=0;this.moving=false;this.onStep();}
    }
    this.updateCam(false);
  }
  onStep(){
    G.steps++;this.stepsSince++;
    const ch=this.grid[this.py][this.px];
    if(this.kind==='over'){
      const d=this.doors.find(d=>d.x===this.px&&d.y===this.py);
      if(d){this.enterDoor(d);return;}
      if(ch==='g'&&this.stepsSince>5&&Math.random()<0.055){this.stepsSince=0;this.encounter(overworldEnc(overworldRegion(this.py)));}
      return;
    }
    if(this.exit&&this.px===this.exit.x&&this.py===this.exit.y){this.busy=true;fadeOut(()=>leaveToOverworld(this.opts.door));return;}
    if(this.boss&&this.opts.bossActive&&Math.abs(this.px-this.boss.x)+Math.abs(this.py-this.boss.y)<=1){this.opts.onBoss(this);return;}
    if(this.opts.enc&&this.stepsSince>4&&Math.random()<this.opts.rate){this.stepsSince=0;this.encounter(pick(this.opts.enc));}
  }
  enterDoor(d){
    const b=BUILDINGS[d.id];this.busy=true;
    if(b.ch&&b.ch>G.chapter){this.busy=false;this.py+=1;AudioSys.sfx('error');say('*|'+b.name+' is locked. Clear the previous dungeon first.');return;}
    AudioSys.sfx('confirm');G.overPos=[d.x,d.y+1];
    fadeOut(()=>{if(b.room)enterRoom(b.room);else enterDungeon(b.ch);});
  }
  encounter(group){
    this.busy=true;AudioSys.sfx('encounter');FX.flash=8;FX.flashC='#fff';let n=0;const self=this;
    const tick={update(){n++;if(n>25){Scene.pop();startBattle({enemies:group,theme:self.opts.themeName,canFlee:true,onEnd(r){self.busy=false;if(r==='lose')gameOver();}});}},draw(){if((n>>2)&1){ctx.globalAlpha=0.5;rect(0,0,W,H,'#000');ctx.globalAlpha=1;}}};
    Scene.push(tick);
  }
  interact(){
    const [fx,fy]=this.facing();
    const npc=this.npcs.find(n=>n.x===fx&&n.y===fy);
    if(npc){AudioSys.sfx('confirm');const d=npc.data;
      if(d.shop){runCutscene(d.lines(),()=>Scene.push(new ShopScene(d.shop)));}
      else if(d.levelshop){runCutscene(d.lines(),()=>Scene.push(new LevelShopScene()));}
      else if(d.heal){fullHeal();AudioSys.sfx('heal');runCutscene(d.lines().concat(['*|Everyone is fully healed!']),()=>Scene.push(new ShopScene('nurse')));}
      else runCutscene(d.lines());return;}
    const ch=this.grid[fy]&&this.grid[fy][fx];
    if(ch==='C'){const c=this.chests.find(c=>c.x===fx&&c.y===fy);if(c&&!this.chestOpened(c)){G.flags[this.opts.chestKey+c.idx]=true;addItem(c.item);AudioSys.sfx('chest');say('*|Found '+ITEMS[c.item].name+'! '+ITEMS[c.item].desc);}return;}
    if(ch==='B'&&this.opts.roomId==='classroom'){AudioSys.sfx('confirm');Scene.push(new WhiteboardScene());return;}
    if(ch==='J'){const list=['over','hub','fieldA','fieldB','fieldC','town','dungeon'];const i=(list.indexOf(G.overMusic)+1)%list.length;G.overMusic=list[i];AudioSys.sfx('item');say('*|The jukebox clunks. School-grounds music set to track '+(i+1)+' of '+list.length+'.');return;}
    if(ch==='W'&&this.kind!=='over'){say("*|Outside, the school grounds glow under a purple crayon sky. Somewhere, a Smartboard hums.");return;}
    if(ch==='S'&&this.opts.roomId==='classroom'){say("*|Class readers. Every author photo has a moustache. Donny looks innocent. Too innocent.");return;}
    if(ch==='F'){say("*|The fridge. A note: 'DO NOT TOUCH - JANET'. It has been a year. Nobody has touched it.");return;}
    if(ch==='v'){say("*|A vending machine. It now sells 'Salt & Vinegar' AND a second, mysterious flavour. It is also Salt & Vinegar.");return;}
    if(ch==='Q'){say("*|A Smartboard panel. It's showing a screensaver of a very slow toaster.");return;}
    if(ch==='M'){say("*|A school computer. The wallpaper is a photo of a different, nicer computer.");return;}
    if(ch==='z'){say("*|A server rack. Lights blink in a pattern that spells something rude in binary.");return;}
    if(ch==='x'){say("*|A science bench. Someone has labelled every beaker 'DO NOT DRINK'. One is labelled 'DRINK'.");return;}
    if(ch==='L'){say("*|Lockers. One of them is humming the school song.");return;}
    const here=this.grid[this.py][this.px];
    if(here==='m'||ch==='m'||ch==='H'){AudioSys.sfx('heal');fullHeal();say('*|The buddies flop down. HP and MP fully restored!');return;}
    if(this.boss&&this.opts.bossActive&&fx===this.boss.x&&fy===this.boss.y){this.opts.onBoss(this);}
  }
  draw(){
    const cx=Math.round(this.camX),cy=Math.round(this.camY);
    rect(0,0,W,H,this.theme.bg);
    ctx.drawImage(this.layer,-cx,-cy);
    for(const c of this.chests)drawChest(c.x*16-cx,c.y*16-cy,this.chestOpened(c));
    if(this.kind==='over'){for(const d of this.doors){const b=BUILDINGS[d.id];const locked=b.ch&&b.ch>G.chapter;const lx=d.x*16-cx+8,ly=d.y*16-cy-20;
        const label=b.ch?(locked?'LOCKED':b.name+' LV'+DUNGEONS[b.ch].lvl.split('-')[0]):b.name;const wdt=textW(label,1)+6;rect(lx-wdt/2,ly-2,wdt,9,'#000');textC(label,lx,ly,locked?'#8090c0':b.ch?'#f9d83a':'#8be36a',1);
        if(locked){rect(d.x*16-cx+5,d.y*16-cy+4,6,5,'#8a94a8');}else if(b.ch&&G.cleared[b.ch]){text('*',d.x*16-cx+11,d.y*16-cy+2,'#8be36a',1);}}}
    const ents=[];
    for(const n of this.npcs)ents.push({y:n.y*16,f:()=>drawSprite(SPR[n.spr],n.x*16-cx,n.y*16-cy-(((this.t>>4)&1)?1:0))});
    if(this.boss&&this.opts.bossActive&&this.opts.bossSpr)ents.push({y:this.boss.y*16,f:()=>drawSprite(SPR[this.opts.bossSpr],this.boss.x*16-cx-8,this.boss.y*16-cy-16+(((this.t>>3)&1)?1:0),2)});
    const px=this.px*16+this.ox-cx,py=this.py*16+this.oy-cy;
    ents.push({y:this.py*16+this.oy,f:()=>{
      let spr,flip=false;const f=this.moving&&((this.anim>>3)&1);
      if(this.dir==='down')spr=f?SPR.fred_down2:SPR.fred_down;else if(this.dir==='up'){spr=SPR.fred_up;}else{spr=f?SPR.fred_side2:SPR.fred_side;flip=this.dir==='left';}
      if(this.dir==='up'&&f){drawSprite(spr,px,py-1,1);}else drawSprite(spr,px,py,1,flip);
    }});
    ents.sort((a,b)=>a.y-b.y);for(const e of ents)e.f();
    if(this.opts.title&&this.t<180){const a=this.t<150?1:(180-this.t)/30;ctx.globalAlpha=a;box(W/2-100,8,200,30);textC(this.opts.title,W/2,13,'#f9d83a',2);textC(this.opts.sub||'',W/2,26,'#fff',1);ctx.globalAlpha=1;}
    if(this.kind==='over'){text('CH.'+Math.min(10,G.chapter)+' '+(G.chapter>10?'POST-GAME':DUNGEONS[G.chapter].name.toUpperCase()),4,4,'#f9d83a',1,'#000');}
  }
}

// ---------- NAVIGATION ----------
function enterOverworld(pos){
  const p=pos||G.overPos||[6,6];
  const m=new MapScene(OVERWORLD,'over',{kind:'over',npcs:[],chests:[],chestKey:'ov_',themeName:'over',startPos:p});
  Scene.replace(m);G.location='over';AudioSys.playSong(G.overMusic||'over');
}
function leaveToOverworld(doorId){const d=Object.entries(BUILDINGS).find(([k])=>k===doorId);let pos=G.overPos;enterOverworld(pos);}
function enterRoom(id){
  const R=ROOMS[id];const npcs=R.npcs.map(k=>NPCS[k]);
  const m=new MapScene(R.map,R.theme,{kind:'room',roomId:id,npcs,chests:[],chestKey:'r_'+id+'_',themeName:R.theme,door:R.door,title:R.name});
  Scene.replace(m);G.location='room:'+id;AudioSys.playSong(R.music);
  if(id==='classroom'&&!G.flags.intro){G.flags.intro=true;runCutscene(CUT.intro,()=>{G.savePos={where:'room',id:'classroom'};saveGame();});}
}
function enterDungeon(n){
  const D=DUNGEONS[n];const cleared=G.cleared[n];
  const scene=new MapScene(D.map,D.theme,{kind:'dungeon',npcs:[D.npc],chests:D.chests,chestKey:'d'+n+'_',enc:D.enc,rate:D.rate,themeName:D.theme,title:D.name,sub:'CHAPTER '+n+'  REC. LV '+D.lvl,door:String(n%10),
    bossActive:true,bossSpr:ENEMIES[D.boss].spr,
    onBoss(ms){ms.busy=true;const fight=()=>{startBattle({enemies:[D.boss],boss:true,theme:D.theme,canFlee:false,music:D.bossMusic,onEnd(r){
        if(r==='lose'){gameOver();return;}
        if(D.boss2){const mid=()=>startBattle({enemies:[D.boss2],boss:true,theme:D.theme,canFlee:false,music:'final',onEnd(r2){if(r2==='lose'){gameOver();return;}finishDungeon(n);}});
          if(!cleared)runCutscene(CUT.d10mid,()=>{for(const h of partyHeroes())h.hp=Math.max(h.hp,Math.floor(heroStat(h,'hp')*0.6));mid();});else mid();}
        else finishDungeon(n);
      }});};
      if(cleared)fight();else runCutscene(CUT['d'+n+'pre'],fight);}
  });
  Scene.replace(scene);G.location='dungeon:'+n;AudioSys.playSong(D.music);
  if(!cleared&&!G.flags['d'+n+'intro']){G.flags['d'+n+'intro']=true;runCutscene(CUT['d'+n+'intro']);}
}
function finishDungeon(n){
  const first=!G.cleared[n];G.cleared[n]=true;
  const done=()=>{
    fullHeal();const bonus=first?[0,120,200,300,450,600,800,1000,1300,1600,2500][n]:[0,40,60,80,110,140,180,220,260,300,400][n];G.merit+=bonus;
    if(first&&n===10){G.ending=true;G.chapter=11;fadeOut(()=>{Scene.replace(new EndingScene());});return;}
    if(first)G.chapter=Math.max(G.chapter,n+1);
    runCutscene(['*|'+DUNGEONS[n].name+' cleared! Bonus: '+bonus+' merits. Everyone is fully healed.'+(first?' Chapter '+G.chapter+' begins.':'')],()=>{
      G.savePos={where:'over',pos:G.overPos};saveGame();fadeOut(()=>{enterOverworld();say('*|Progress saved automatically.');});});
  };
  if(first)runCutscene(CUT['d'+n+'post'],done);else done();
}
function loadAndGo(){const s=loadGame();if(!s)return false;G=s;const sp=G.savePos||{where:'room',id:'classroom'};fadeOut(()=>{if(sp.where==='over')enterOverworld(sp.pos);else enterRoom(sp.id||'classroom');});return true;}
function gameOver(){AudioSys.stopSong();Scene.replace(new GameOverScene());}

// ---- p7_battle.js ----
// ===================== BB2 BATTLE SYSTEM (CTB delay, DP sketches, shields, dynamic bosses) =====================
function startBattle(opts){Scene.push(new BattleScene(opts));}
const ELEM_COL={fire:'#f28c28',water:'#7fb0f5',wind:'#8be36a',ink:'#b070e0',volt:'#f9d83a',none:'#fff'};

class BattleScene{
  constructor(opts){
    this.opaque=true;this.opts=opts;this.theme=THEMES[opts.theme]||THEMES.hub;this.t=0;this.dmg=[];this.msg='';this.msgT=0;this.wait=0;this.gen=null;this.sketch=null;this.fx=[];
    this.party=partyHeroes().map((h,i)=>this.mkHero(h,i));
    this.enemies=[];opts.enemies.forEach((id,i)=>this.addEnemy(id,i,opts.enemies.length,true));
    for(const b of this.all())b.ct=Math.round(1000/b.spd*rnd(0.4,1));
    this.state='intro';this.cmd=new Menu(['Attack','Skill','Draw','Item','Guard','Run'],{cols:2});this.actor=null;this.phase='cmd';
    this.prevSong=AudioSys.songName;AudioSys.playSong(opts.music||(opts.boss?'boss':'battle'));G.battles++;
    if(opts.boss)FX.shake=20;
  }
  mkHero(h,i){return {kind:'hero',h,id:h.id,name:HEROES[h.id].name,spr:HEROES[h.id].spr,color:HEROES[h.id].color,
      hp:h.hp,maxhp:heroStat(h,'hp'),mp:h.mp,maxmp:heroStat(h,'mp'),atk:heroStat(h,'atk'),def:heroStat(h,'def'),mag:heroStat(h,'mag'),spd:heroStat(h,'spd'),lvl:h.lvl,
      dp:0,shield:0,status:{},guard:false,dead:h.hp<=0,x:300,y:40+i*32,ox:0,oy:0,flash:0,scale:2,alpha:1};}
  addEnemy(id,i,n,initial){
    const e=ENEMIES[id];const sc=e.boss?5:3;let fx,fy;
    if(initial){fx=e.boss?55:(n===1?85:40+i*58);fy=e.boss?160:150-(i%2)*14;}
    else{const k=this.enemies.filter(x=>!x.dead&&!x.boss).length;fx=150+k*48;fy=150-(k%2)*14;}
    const b={kind:'enemy',e,id,name:e.name,spr:e.spr,hp:e.hp,maxhp:e.hp,mp:0,atk:e.atk,def:e.def,mag:e.mag,spd:e.spd,dp:0,shield:e.startShield||0,status:{},guard:false,dead:false,
      x:fx-16*sc/2+24,y:fy-16*sc,ox:initial?-200:-300,oy:0,flash:0,scale:sc,alpha:1,boss:!!e.boss,weak:e.weak,acts:e.acts,phasesDone:[],charging:null,enraged:false,revived:false,lvl:e.lvl};
    b.ct=Math.round(1000/b.spd*rnd(0.5,1));this.enemies.push(b);return b;
  }
  all(){return [...this.party,...this.enemies];}
  alive(list){return list.filter(b=>!b.dead);}
  eff(b,k){let v=b[k];const s=b.status;if(k==='atk'){if(s.atkUp)v*=1.3;if(s.atkDown)v*=0.7;}if(k==='def'){if(s.defUp)v*=1.3;if(s.defDown)v*=0.7;}if(k==='spd'){if(s.spdUp)v*=1.5;if(s.slow)v*=0.6;}return v;}
  center(b){return {x:b.x+b.ox+8*b.scale,y:b.y+b.oy+8*b.scale};}
  say(m,t=60){this.msg=m;this.msgT=t;}
  num(b,txt,color){const c=this.center(b);this.dmg.push({x:c.x+rnd(-8,8),y:c.y-10,txt:String(txt),color,t:0});}
  tag(b,txt,color){const c=this.center(b);this.dmg.push({x:c.x-10,y:c.y-32,txt,color,t:0});}
  addDP(b,n){if(b.kind!=='hero'||b.dead)return;const before=b.dp;b.dp=clamp(b.dp+n,0,100);if(before<30&&b.dp>=30)AudioSys.sfx('dp');}
  nextActor(){const a=this.alive(this.all());let min=Infinity,who=null;for(const b of a)if(b.ct<min){min=b.ct;who=b;}for(const b of a)b.ct-=min;return who;}
  preview(n=8){const a=this.alive(this.all()).map(b=>({b,ct:b.ct}));const out=[];for(let k=0;k<n&&a.length;k++){let m=a[0];for(const x of a)if(x.ct<m.ct)m=x;out.push(m.b);const d=m.ct;for(const x of a)x.ct-=d;m.ct+=Math.round(100*10/this.eff(m.b,'spd'));}return out;}
  applyDelay(b,delay){b.ct+=Math.round(delay*10/Math.max(1,this.eff(b,'spd')));}
  // ---- damage ----
  hitPhys(a,t,pow,o={}){const base=Math.max(2,this.eff(a,'atk')*2.2-this.eff(t,'def'));return this.finish(a,t,base*pow*rnd(0.9,1.1),o);}
  hitMag(a,t,pow,o={}){const base=Math.max(2,this.eff(a,'mag')*2.4-this.eff(t,'def')*0.6);return this.finish(a,t,base*pow*rnd(0.9,1.1),o);}
  finish(a,t,d,o){
    let tag='';const el=o.elem||'none';
    if(t.kind==='enemy'){
      if(t.e.absorb&&t.e.absorb===el){const h=Math.round(d);t.hp=Math.min(t.maxhp,t.hp+h);this.num(t,'+'+h,'#8be36a');this.tag(t,'ABSORB!','#8be36a');AudioSys.sfx('heal');return 0;}
      if(t.weak==='any'||t.weak===el){d*=1.5;tag='WEAK!';}else if(t.e.resist===el){d*=0.5;tag='RESIST';}
    }
    const cc=(o.crit||0)+0.06;let crit=false;if(Math.random()<cc){d*=1.6;crit=true;tag='CRIT!';}
    if(t.guard)d*=0.5;
    d=Math.max(1,Math.round(d));
    let absorbed=0;
    if(t.kind==='enemy'&&t.e.sketchShield&&t.shield>0&&!o.draw&&!o.pierce){absorbed=d;d=0;tag='SKETCH IT!';}
    else if(t.shield>0&&!o.pierce){absorbed=Math.min(t.shield,d);t.shield-=absorbed;d-=absorbed;}
    t.hp=Math.max(0,t.hp-d);t.flash=8;
    const c=this.center(t);
    if(absorbed>0)this.dmg.push({x:c.x-6,y:c.y-22,txt:'-'+absorbed,color:'#7fb0f5',t:0});
    if(d>0||absorbed===0)this.num(t,d,crit?'#f9d83a':(t.kind==='hero'?'#ff7b6b':'#fff'));
    if(tag)this.tag(t,tag,tag==='WEAK!'?'#f28c28':tag==='CRIT!'?'#f9d83a':tag==='SKETCH IT!'?'#25a5a5':'#8090c0');
    AudioSys.sfx(crit?'crit':'hit');FX.shake=Math.max(FX.shake,crit?8:4);
    this.addDP(t,absorbed>0&&d===0?5:10);
    if(t.hp<=0)this.kill(t);
    return d;
  }
  kill(b){
    if(b.kind==='enemy'&&b.e.revive&&!b.revived){b.revived=true;b.hp=Math.round(b.maxhp*b.e.revive.pct);b.status={};this.say(b.e.revive.say,90);this.tag(b,'REVIVED!','#ff7b6b');AudioSys.sfx('levelup');FX.shake=15;return;}
    b.dead=true;b.status={};b.shield=0;b.guard=false;b.charging=null;AudioSys.sfx('die');if(b.kind==='enemy')b.dying=30;
  }
  heal(t,amt){if(t.dead)return;amt=Math.round(amt);const before=t.hp;t.hp=Math.min(t.maxhp,t.hp+amt);this.num(t,'+'+(t.hp-before),'#8be36a');AudioSys.sfx('heal');}
  addStatus(t,st,turns){if(t.dead)return;if(t.kind==='enemy'&&t.boss&&(st==='poison'||st==='slow')){this.num(t,'IMMUNE','#8090c0');return;}t.status[st]=turns;this.num(t,STATUS_INFO[st].n,STATUS_INFO[st].c);AudioSys.sfx(['atkUp','defUp','spdUp'].includes(st)?'buff':'debuff');}
  cure(t){for(const k of ['poison','atkDown','defDown','slow'])delete t.status[k];}
  targetsFor(actor,tt,idx){
    const foes=actor.kind==='hero'?this.enemies:this.party,pals=actor.kind==='hero'?this.party:this.enemies;
    switch(tt){case 'enemy':return [foes[idx]];case 'enemies':return this.alive(foes);case 'ally':return [pals[idx]];case 'allies':return this.alive(pals);case 'self':return [actor];
      case 'random':{const a=this.alive(foes);return a.length?[pick(a)]:[];}}
    return [];
  }
  // ---- update ----
  update(){
    this.t++;if(this.msgT>0)this.msgT--;
    for(const d of this.dmg)d.t++;this.dmg=this.dmg.filter(d=>d.t<40);
    for(const b of this.all()){if(b.flash>0)b.flash--;if(b.kind==='enemy'&&!b.dead&&this.state!=='intro')b.ox+=(0-b.ox)*0.2;if(b.dying>0){b.dying--;b.alpha=b.dying/30;}}
    if(this.state==='intro'){for(const e of this.enemies)e.ox+=(0-e.ox)*0.15;if(this.t===5)this.say(this.opts.boss?this.enemies[0].name+' blocks the way!':(this.enemies.length>1?'Nasty things appear!':this.enemies[0].name+' appears!'),80);if(this.t>50){this.state='tick';}return;}
    if(this.state==='tick'){this.beginTurn();return;}
    if(this.state==='act'){if(this.wait>0){this.wait--;return;}const r=this.gen.next();if(r.done){this.gen=null;this.afterAction();}else this.wait=r.value||0;return;}
    if(this.state==='command'){this.updateCommand();return;}
    if(this.state==='victory'){this.updateVictory();return;}
    if(this.state==='defeat'){if(this.wait>0){this.wait--;return;}Scene.pop();this.opts.onEnd('lose');return;}
    if(this.state==='flee'){if(this.wait>0){this.wait--;return;}this.syncBack();Scene.pop();this.opts.onEnd('flee');return;}
  }
  beginTurn(){
    const a=this.nextActor();if(!a)return;this.actor=a;a.guard=false;
    for(const k in a.status){a.status[k]--;if(a.status[k]<=0){delete a.status[k];}}
    if(a.status.poison!==undefined){const d=Math.max(1,Math.round(a.maxhp*0.06));a.hp=Math.max(0,a.hp-d);this.num(a,d,'#b070e0');AudioSys.sfx('poison');if(a.hp<=0){this.kill(a);this.applyDelay(a,100);this.afterAction();return;}}
    if(a.kind==='hero'){this.state='command';this.phase='cmd';this.cmd.i=0;this.say(a.name+"'s turn",40);}
    else{this.state='act';this.gen=this.enemyAct(a);}
  }
  afterAction(){
    // boss phase triggers
    for(const e of this.enemies){if(e.dead||!e.e.phases)continue;const ratio=e.hp/e.maxhp;
      for(let i=0;i<e.e.phases.length;i++){const p=e.e.phases[i];if(!e.phasesDone[i]&&ratio<=p.at){e.phasesDone[i]=true;this.state='act';this.gen=this.phaseGen(e,p);return;}}}
    if(this.alive(this.enemies).length===0){this.startVictory();return;}
    if(this.alive(this.party).length===0){this.state='defeat';this.wait=90;AudioSys.stopSong();AudioSys.playSong('gameover');return;}
    this.state='tick';
  }
  *phaseGen(e,p){
    FX.flash=8;FX.flashC='#fff';FX.shake=14;e.flash=10;AudioSys.sfx('crit');this.say(e.name+': '+p.say,120);yield 40;
    if(p.weak){e.weak=p.weak;this.tag(e,p.weak==='any'?'WEAK TO ALL':'WEAK: '+p.weak.toUpperCase(),'#f28c28');yield 20;}
    if(p.heal){this.heal(e,e.maxhp*p.heal);yield 20;}
    if(p.shield){e.shield+=p.shield;this.num(e,'SH+'+p.shield,'#7fb0f5');AudioSys.sfx('shield');yield 20;}
    if(p.acts){e.acts=p.acts;}
    if(p.enrage){e.enraged=true;e.atk=Math.round(e.atk*1.35);e.spd=Math.round(e.spd*1.25);this.tag(e,'ENRAGED!','#ff7b6b');AudioSys.sfx('buff');yield 20;}
    if(p.summon){for(const id of p.summon){if(this.alive(this.enemies).filter(x=>!x.boss).length>=3)break;const s=this.addEnemy(id,0,1,false);AudioSys.sfx('pop');this.say(s.name+' appears!',50);for(let i=0;i<14;i++){s.ox+=(0-s.ox)*0.25;yield 1;}s.ox=0;}}
    yield 20;
  }
  // ---- command input ----
  updateCommand(){
    const a=this.actor;
    if(this.phase==='cmd'){
      const r=this.cmd.update();
      if(r==='ok'){const c=this.cmd.items[this.cmd.i];AudioSys.sfx('confirm');
        if(c==='Attack'){this.pending={kind:'attack',tt:'enemy'};this.startTarget('enemy');}
        else if(c==='Skill'){this.list=heroSkills(a.h).map(id=>({id,d:SKILLS[id],kind:'skill'}));if(!this.list.length){AudioSys.sfx('error');return;}this.sub=new Menu(this.list);this.phase='sub';}
        else if(c==='Draw'){this.list=heroDraws(a.h).map(id=>({id,d:DRAWS[id],kind:'draw'}));this.sub=new Menu(this.list);this.phase='sub';}
        else if(c==='Item'){this.list=Object.keys(G.inv).filter(k=>G.inv[k]>0).map(id=>({id,d:ITEMS[id],kind:'item'}));if(!this.list.length){AudioSys.sfx('error');this.say('No items!',40);return;}this.sub=new Menu(this.list);this.phase='sub';}
        else if(c==='Guard'){this.execute({kind:'guard'},[a]);}
        else if(c==='Run'){if(!this.opts.canFlee){AudioSys.sfx('error');this.say("Can't run from this!",50);return;}this.execute({kind:'run'},[]);}
      }
      return;
    }
    if(this.phase==='sub'){
      const r=this.sub.update();
      if(r==='cancel'){AudioSys.sfx('cancel');this.phase='cmd';return;}

class PauseMenu{
  constructor(map){this.map=map;this.tabs=['Items','Status','Skills','Party','Controls','Quit to Title'];this.menu=new Menu(this.tabs);this.mode='tabs';this.msg='';this.hero=0;}
  update(){
    if(this.mode==='tabs'){const r=this.menu.update();
      if(r==='cancel'){AudioSys.sfx('cancel');Scene.pop();return;}
      if(r==='ok'){const t=this.tabs[this.menu.i];AudioSys.sfx('confirm');
        if(t==='Items'){this.items=Object.keys(G.inv).filter(k=>G.inv[k]>0);if(!this.items.length){this.msg='No items.';return;}this.sub=new Menu(this.items);this.mode='items';}
        else if(t==='Status'){this.mode='status';this.hero=0;}
        else if(t==='Skills'){this.mode='skills';this.hero=0;}
        else if(t==='Party'){this.mode='party';}
        else if(t==='Controls')Scene.push(new ControlsScene());
        else if(t==='Quit to Title'){this.mode='confirm';}}
      return;}
    if(this.mode==='confirm'){if(Input.confirmP()){AudioSys.sfx('confirm');Scene.pop();AudioSys.stopSong();fadeOut(()=>Scene.replace(new TitleScene()));}else if(Input.cancelP()||Input.escP()){AudioSys.sfx('cancel');this.mode='tabs';}return;}
    if(this.mode==='party'){if(Input.cancelP()||Input.escP()||Input.confirmP()){AudioSys.sfx('cancel');this.mode='tabs';}return;}
    if(this.mode==='items'){const r=this.sub.update();if(r==='cancel'){AudioSys.sfx('cancel');this.mode='tabs';return;}
      if(r==='ok'){const id=this.items[this.sub.i],it=ITEMS[id];if(it.battleOnly){AudioSys.sfx('error');this.msg='Battle only!';return;}
        if(it.target==='allies'){for(const h of partyHeroes())this.applyField(it,h);addItem(id,-1);AudioSys.sfx('heal');this.refreshItems();return;}
        AudioSys.sfx('confirm');this.mode='pickhero';this.hero=0;this.useId=id;}return;}
    if(this.mode==='pickhero'){const n=G.party.length;if(Input.nav('up')){this.hero=(this.hero-1+n)%n;AudioSys.sfx('cursor');}if(Input.nav('down')){this.hero=(this.hero+1)%n;AudioSys.sfx('cursor');}
      if(Input.cancelP()||Input.escP()){AudioSys.sfx('cancel');this.mode='items';return;}
      if(Input.confirmP()){const it=ITEMS[this.useId];const h=partyHeroes()[this.hero];if(this.applyField(it,h)){addItem(this.useId,-1);AudioSys.sfx('heal');this.refreshItems();this.mode=this.items.length?'items':'tabs';}else{AudioSys.sfx('error');this.msg="Can't use that here.";}}return;}
    if(this.mode==='status'||this.mode==='skills'){const n=G.party.length;if(Input.nav('left')||Input.nav('up')){this.hero=(this.hero-1+n)%n;AudioSys.sfx('cursor');}if(Input.nav('right')||Input.nav('down')){this.hero=(this.hero+1)%n;AudioSys.sfx('cursor');}
      if(Input.cancelP()||Input.escP()||Input.confirmP()){AudioSys.sfx('cancel');this.mode='tabs';}return;}
  }
  refreshItems(){this.items=Object.keys(G.inv).filter(k=>G.inv[k]>0);this.sub=new Menu(this.items);if(this.sub.i>=this.items.length)this.sub.i=Math.max(0,this.items.length-1);}
  applyField(it,h){const mx=heroStat(h,'hp'),mm=heroStat(h,'mp');
    if(it.type==='heal'){if(h.hp<=0)return false;h.hp=Math.min(mx,h.hp+(it.amt||Math.round(mx*it.pct)));return true;}
    if(it.type==='mp'){if(h.hp<=0)return false;h.mp=Math.min(mm,h.mp+it.amt);return true;}
    if(it.type==='revive'){if(h.hp>0)return false;h.hp=Math.round(mx*it.pct);return true;}
    if(it.type==='full'){h.hp=mx;h.mp=mm;return true;}
    if(it.type==='cure'){return true;}
    return false;}
  draw(){
    ctx.globalAlpha=0.5;rect(0,0,W,H,'#000');ctx.globalAlpha=1;
    box(0,0,110,H);text('MENU',10,8,'#f9d83a',2);
    this.tabs.forEach((t,i)=>{const y=26+i*16;if(this.mode==='tabs'&&i===this.menu.i)text('}',6,y,'#f9d83a',2);text(t,16,y,i===this.menu.i?'#fff':'#c8d0f0',t.length>9?1:2);});
    text('CHAPTER '+Math.min(11,G.chapter),10,170,'#8090c0',1);text('MERITS',10,182,'#8090c0',1);text(G.merit,10,190,'#8be36a',2);text('STEPS '+G.steps,10,206,'#8090c0',1);text('BATTLES '+G.battles,10,214,'#8090c0',1);text('SAVE: WHITEBOARD',10,224,'#8090c0',1);
    box(110,0,290,H);
    const heroes=partyHeroes();
    if(this.mode==='tabs'||this.mode==='confirm'||this.mode==='items'||this.mode==='pickhero'){
      heroes.forEach((h,i)=>{const y=8+i*40;const d=HEROES[h.id];const mx=heroStat(h,'hp'),mm=heroStat(h,'mp');
        if(this.mode==='pickhero'&&i===this.hero)text('}',114,y+8,'#f9d83a',2);
        drawSprite(SPR[d.spr],122,y,2,true);text(d.name,160,y,h.hp<=0?'#606880':'#fff',2);text('LV '+h.lvl,230,y,'#f9d83a',2);
        text('HP '+h.hp+'/'+mx,160,y+13,h.hp<=0?'#ff7b6b':'#c8d0f0',1);bar(160,y+21,100,5,h.hp/mx,'#8be36a');
        text('MP '+h.mp+'/'+mm,270,y+13,'#c8d0f0',1);bar(270,y+21,60,5,h.mp/mm,'#7fb0f5');
        if(h.hp<=0)text('KO',340,y+13,'#ff7b6b',2);});
      if(this.mode==='items'||this.mode==='pickhero'){box(200,120,200,120);text('ITEMS',208,126,'#f9d83a',2);
        const off=Math.max(0,this.sub.i-6);
        this.items.slice(off,off+7).forEach((id,k)=>{const i=k+off;const y=140+k*12;if(this.mode==='items'&&i===this.sub.i)text('}',206,y,'#f9d83a',2);text(ITEMS[id].name,216,y,ITEMS[id].battleOnly?'#8090c0':'#fff',2);textR('x'+G.inv[id],392,y,'#c8d0f0',2);});
        const it=ITEMS[this.items[this.sub.i]];if(it)wrap(it.desc,44).forEach((l,i)=>text(l,208,222+i*8,'#c8d0f0',1));}
      if(this.mode==='confirm'){box(150,90,200,50);textC('Quit to title? (unsaved progress lost)',250,98,'#fff',1);textC('Z: YES   X: NO',250,118,'#f9d83a',2);}
      text(this.msg,120,226,'#f9d83a',1);
    }
    else if(this.mode==='status'){const h=heroes[this.hero];const d=HEROES[h.id];
      drawSprite(SPR[d.spr],124,10,3,true);text(d.name,180,10,'#fff',2);text(d.title,180,22,'#f9d83a',1);text('LV '+h.lvl+'   XP '+h.xp+' / '+XP_FOR(h.lvl),180,32,'#c8d0f0',1);
      const rows=[['HP',h.hp+'/'+heroStat(h,'hp')],['MP',h.mp+'/'+heroStat(h,'mp')],['ATK',heroStat(h,'atk')],['DEF',heroStat(h,'def')],['MAG',heroStat(h,'mag')],['SPD',heroStat(h,'spd')]];
      rows.forEach((r,i)=>{text(r[0],124+(i%2)*90,66+Math.floor(i/2)*14,'#8090c0',2);text(r[1],154+(i%2)*90,66+Math.floor(i/2)*14,'#fff',2);});
      wrap(d.bio,66).forEach((l,i)=>text(l,124,120+i*8,'#c8d0f0',1));
      text('< >: SWITCH BUDDY   X: BACK',124,226,'#8090c0',1);}
    else if(this.mode==='skills'){const h=heroes[this.hero];const d=HEROES[h.id];
      drawSprite(SPR[d.spr],124,6,2,true);text(d.name+"'S SKILLS",162,10,'#fff',2);
      let y=40;for(const id of d.skills){const s=SKILLS[id];const ok=s.lvl<=h.lvl;text((ok?s.name:'??? (LV '+s.lvl+')'),124,y,ok?'#fff':'#606880',2);textR(s.mp+'MP',392,y,ok?'#7fb0f5':'#606880',1);if(ok)text(s.desc,124,y+10,'#c8d0f0',1);y+=18;}

      text('< >: SWITCH BUDDY   X: BACK',124,226,'#8090c0',1);}
    else if(this.mode==='party'){text('THE BOARD BUDDIES',124,10,'#f9d83a',2);
      Object.keys(HEROES).forEach((id,i)=>{const y=28+i*26;const h=G.heroes[id];const d=HEROES[id];const inP=G.party.includes(id);
        ctx.globalAlpha=inP?1:0.45;drawSprite(SPR[d.spr],126,y-2,1,true);text(d.name+'  LV '+h.lvl,150,y,inP?'#fff':'#8090c0',2);text(inP?'IN PARTY  -  '+d.title:'AWAY  -  '+d.title,150,y+11,inP?'#8be36a':'#606880',1);ctx.globalAlpha=1;});
      text('Guests join and leave with the story. X: BACK',124,226,'#8090c0',1);}
  }
}

// ===================== MAIN LOOP =====================
let lastT=0,acc=0;const STEP=1000/60;let errShown=null;
window.addEventListener('error',e=>{errShown=e.message;console.error(e.error||e.message);});
function mainLoop(ts){
  requestAnimationFrame(mainLoop);
  if(!lastT)lastT=ts;let dt=ts-lastT;lastT=ts;if(dt>100)dt=100;acc+=dt;
  let steps=0;
  while(acc>=STEP&&steps<4){
    if(Input.muteP()){AudioSys.toggle();}
    try{Scene.update();}catch(e){errShown=e.message;console.error(e);}
    updateFX();Input.flush();acc-=STEP;steps++;
  }
  ctx.save();if(FX.shake>0)ctx.translate(rint(-2,2),rint(-2,2));
  try{Scene.draw();}catch(e){errShown=e.message;console.error(e);}
  ctx.restore();
  drawFX();
  if(!AudioSys.on){text('MUTED',W-30,2,'#8090c0',1);}
  if(errShown){rect(0,0,W,12,'#800');text('ERR: '+errShown.slice(0,60),2,3,'#fff',1);}
}
Scene.replace(new TitleScene());
requestAnimationFrame(mainLoop);

</script>
